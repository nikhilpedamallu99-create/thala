services:
  - type: web
    name: thala-rag-backend
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./knowledge_base.db
      - key: UPLOAD_DIR
        value: ./uploads
      - key: VECTOR_STORE_DIR
        value: ./vector_store
